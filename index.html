    if(!data||!data.matches||data.matches.length===0){throw new Error("no data")}
    MS=data.matches.map(function(m){
      return {
        id:m.id,
        g:m.group?m.group.replace("GROUP_",""):null,
        date:(m.utcDate||"").split("T")[0],
        time:(m.utcDate||"").split("T")[1]?m.utcDate.split("T")[1].substring(0,5):"",
        venue:m.venue||"待定",
        homeTeam:m.homeTeam?m.homeTeam.tla||m.homeTeam.name:"TBD",
        awayTeam:m.awayTeam?m.awayTeam.tla||m.awayTeam.name:"TBD",
        matchday:m.matchday||null,
        homeScore:m.score&&m.score.fullTime&&m.score.fullTime.home!=null?m.score.fullTime.home:null,
        awayScore:m.score&&m.score.fullTime&&m.score.fullTime.away!=null?m.score.fullTime.away:null,
        status:m.status==="FINISHED"?"finished":m.status==="IN_PLAY"||m.status==="PAUSED"?"live":"upcoming",
        round:m.stage==="GROUP_STAGE"?"group":m.stage?m.stage.toLowerCase():null
      }
    });
    USE_API=true;
    localStorage.setItem("wc_data",JSON.stringify(MS));
    localStorage.setItem("wc_sync",Date.now());
    updateStatusBar(true);
    render();
    console.log("✅ API数据获取成功："+MS.length+" 场比赛");
  })
  .catch(function(err){
    console.warn("API获取失败："+err.message+"，尝试缓存");
    // 尝试本地缓存
    try{var cached=JSON.parse(localStorage.getItem("wc_data")||"null");if(cached&&cached.length>0){MS=cached;USE_API=true;updateStatusBar(true,true);render();return}}catch(e){}
    // 最终降级
    MS=genLocalMatches();USE_API=false;
    updateStatusBar(false);
    render();
  })
}

  h+='<div class="ccard"><div class="stitle">📋 使用说明</div><div style="font-size:13px;color:#666;line-height:2">1. 点击上方链接注册免费账号<br>2. 在个人页面复制 API Key<br>3. 粘贴到输入框并点击保存<br>4. 页面将自动获取实时比分<br>5. 每5分钟自动刷新一次数据</div><button class="btn-p" style="margin-top:12px" onclick="forceRefresh()">🔄 手动刷新数据</button></div></div>';return h
}
function saveKey(){var k=$("#akey").value;if(!k||k.length<10){alert("请输入有效的 API 密钥");return}localStorage.setItem("wc_key",k);fetchFromAPI();render();sp("home")}
function forceRefresh(){fetchFromAPI();render();sp("home")}

// ====== 自动定时刷新 ======
setInterval(function(){
  if(localStorage.getItem("wc_key")){fetchFromAPI()}
}, 5*60*1000); // 每5分钟

// ====== 启动 ======
(function init(){
  var key=localStorage.getItem("wc_key");
  // 先渲染本地数据确保页面不空白
  try{var cached=JSON.parse(localStorage.getItem("wc_data")||"null");if(cached&&cached.length>0){MS=cached;USE_API=true}}catch(e){}
  render();
  // 然后异步获取最新数据
  if(key){fetchFromAPI()}else{updateStatusBar(false)}
})();
</script>
</body>
