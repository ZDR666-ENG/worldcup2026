function skey(){var k=$("#akey").value;if(!k||k.length<8){alert("请输入有效的 API 密钥");return}localStorage.setItem("wc_key",k);fetchAPI();render();sp("home")}
function fetchAPI(){
  var k="";try{k=localStorage.getItem("wc_key")||""}catch(e){}
  if(!k)return;
  var url="https://api.football-data.org/v4/competitions/WC/matches?_t="+Date.now();
  fetch(url,{headers:{"X-Auth-Token":k},cache:"no-store"})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
  .then(function(d){
    if(!d||!d.matches||d.matches.length===0)throw new Error("no data");
    MATCHES_RAW=d.matches.map(function(m){
      var ht=m.homeTeam||{},at=m.awayTeam||{},ft=(m.score||{}).fullTime||{};
      var utc=m.utcDate||"";
      var sm={"FINISHED":"finished","IN_PLAY":"live","PAUSED":"live"};
      var stage_map={"GROUP_STAGE":"group","FINAL":"FINAL","THIRD_PLACE":"3RD","SEMI_FINALS":"SF","QUARTER_FINALS":"QF","LAST_16":"16","LAST_32":"32"};
      return{id:m.id,g:(m.group||"").replace("GROUP_","")||null,date:utc.split("T")[0],time:utc.split("T")[1]?utc.split("T")[1].substring(0,5):"",v:m.venue||"",ht:ht.tla||"TBD",at:at.tla||"TBD",md:m.matchday,hs:ft.home,as:ft.away,s:sm[m.status]||"upcoming",r:stage_map[m.stage]||"group",hn:ht.name||"TBD",an:at.name||"TBD",hf:ht.flag||"🏳️",af:at.flag||"🏳️"}
    });
    MATCHES=MATCHES_RAW;
    localStorage.setItem("wc_sync",Date.now());
    localStorage.setItem("wc_data",JSON.stringify(MATCHES_RAW));
    render();
    console.log("API同步完成: "+MATCHES_RAW.length+" 场比赛");
  }).catch(function(e){
    console.warn("API失败: "+e.message);
    var cached=localStorage.getItem("wc_data");
    if(cached){try{MATCHES_RAW=JSON.parse(cached);MATCHES=MATCHES_RAW;render()}catch(e2){}}
  })
}

setInterval(function(){if(localStorage.getItem("wc_key"))fetchAPI()},5*60*1000);

(function(){render();setTimeout(fetchAPI,500)})();
