  for(var i=0;i<fm.length;i++){var m=fm[i];if(m.date!==ld){ld=m.date;h+='<div class="dh"><span class="dt">'+fd(m.date)+'</span>'+(m.md?'<span class="db">第'+m.md+'轮</span>':'')+'</div>'}h+=mkMatch(m)}
  if(!fm.length)h='<div class="empty">暂无比赛</div>';sc.innerHTML=h;
  // Update filter states
  var bs=document.querySelectorAll("#sround .ftag");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-r")===_sr);
  var gs=document.querySelectorAll("#gfilter .ftag");for(var i=0;i<gs.length;i++)gs[i].classList.toggle("on",gs[i].getAttribute("data-g")===_sg)
}
function doGroups(){
  var gc=document.getElementById("gcontent");if(!gc)return;
  var grp=null;for(var i=0;i<STD.length;i++){if(STD[i].g===_sg){grp=STD[i];break}}
  var h='<div class="card"><div class="sti">'+_sg+'组 积分榜</div>';

    h+='<div class="tr"><span class="rc">'+(i+1)+'</span><span class="tc2"><span class="fl">'+s.f+'</span><span class="tn">'+s.n+'</span></span><span style="text-align:center;color:#555">'+s.p+'</span><span style="text-align:center;color:#555">'+s.w+'</span><span style="text-align:center;color:#555">'+s.d+'</span><span style="text-align:center;color:#555">'+s.l+'</span><span style="text-align:center;color:#555">'+s.gf+'</span><span style="text-align:center;color:#555">'+s.ga+'</span><span class="'+gc2+'" style="text-align:center">'+(s.gd>0?"+"+s.gd:s.gd)+'</span><span class="pts">'+s.pts+'</span></div>'}
  h+='</div>'}h+='</div><div class="sti">'+_sg+'组 赛程</div>';
  for(var i=0;i<MS.length;i++){var m=MS[i];if(m.g===_sg&&m.r==="group")h+=mkMatch(m)}
  gc.innerHTML=h;
  var gs=document.querySelectorAll("#gfilter .ftag");for(var i=0;i<gs.length;i++)gs[i].classList.toggle("on",gs[i].getAttribute("data-g")===_sg)
}
function doTeams(){
  var tc=document.getElementById("tcont");if(!tc)return;var h="";
  for(var i=0;i<TEAMS_RAW.length;i++){var t=TEAMS_RAW[i];
    if(_tf!=="all"){var found=false;for(var j=0;j<STD.length;j++){for(var k=0;k<STD[j].t.length;k++){if(STD[j].t[k].id===t.id){found=true;break}}if(found)break}if(!found)continue}
    h+='<div class="trow" data-tid="'+t.id+'"><div class="tl"><span class="fl">'+t.f+'</span><div class="ti"><span class="tn">'+t.n+'</span><span class="en">'+t.e+'</span></div></div><div class="trr"><span class="rk">#'+t.r+'</span></div></div>'}
  tc.innerHTML=h;
  var bs=document.querySelectorAll("#tfilt .ftag");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-c")===_tf)
}

function fetchAPI(){
  var k="";try{k=localStorage.getItem("wc_key")||""}catch(e){}if(!k)return;
  fetch("https://api.football-data.org/v4/competitions/WC/matches?_t="+Date.now(),{headers:{"X-Auth-Token":k},cache:"no-store"})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
  .then(function(d){if(!d||!d.matches)throw new Error("no");
    MS=d.matches.map(function(m){var ht=m.homeTeam||{},at=m.awayTeam||{},ft=(m.score||{}).fullTime||{},utc=m.utcDate||"";
      var stm={"FINISHED":"finished","IN_PLAY":"live","PAUSED":"live"};
      var sm2={"GROUP_STAGE":"group","FINAL":"FINAL","THIRD_PLACE":"3RD","SEMI_FINALS":"SF","QUARTER_FINALS":"QF","LAST_16":"16","LAST_32":"32"};
      return{id:m.id,g:(m.group||"").replace("GROUP_","")||null,date:utc.split("T")[0],time:utc.split("T")[1]?utc.split("T")[1].substring(0,5):"",v:m.venue||"",ht:ht.tla||"TBD",at:at.tla||"TBD",md:m.matchday,hs:ft.home,as:ft.away,s:stm[m.status]||"upcoming",r:sm2[m.stage]||"group"}});
    MATCHES_RAW=MS;localStorage.setItem("wc_sync",Date.now());render()})
  .catch(function(e){console.warn("API:"+e.message)})
}

(function(){render();setTimeout(fetchAPI,500);setInterval(function(){if(localStorage.getItem("wc_key"))fetchAPI()},300000)})();
</script></body></html>
