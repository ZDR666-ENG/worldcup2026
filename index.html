  if(online){
    sb.className="status-bar ok";
    sb.innerHTML="<span>🟢 实时数据"+syncStr+"</span><span>自动更新中</span>";
  }else{
    sb.className="status-bar off";
    sb.innerHTML="<span>🟡 离线模式"+syncStr+"</span><span>使用内置数据</span>";
  }
}

function render(){
  var a=document.getElementById("a"); if(!a) return;
  var MS=getMatches();
  var finished=MS.filter(function(m){ return m.status==="finished" }).length;
  var bannerHTML='<div class="banner"><h1>⚽ 2026 世界杯</h1><p>美国🇺🇸 · 加拿大🇨🇦 · 墨西哥🇲🇽</p><div class="sub">2026年6月11日 — 7月19日 · 104场 · '+finished+'场已完赛</div><div class="stats"><div class="s"><span class="n">48</span><span class="l">参赛队</span></div><div class="s"><span class="n">12</span><span class="l">小组</span></div><div class="s"><span class="n">104</span><span class="l">比赛</span></div></div></div>';
  a.innerHTML='<div id="status-info" class="status-bar"></div>'+bannerHTML+tabbar()+
    '<div class="pg on" id="pg-home">'+pageHome(MS)+'</div>'+
    '<div class="pg" id="pg-schedule">'+pageSchedule(MS)+'</div>'+
    '<div class="pg" id="pg-groups">'+pageGroups(MS)+'</div>'+
    '<div class="pg" id="pg-bracket">'+pageBracket(MS)+'</div>'+
    '<div class="pg" id="pg-teams">'+pageTeams()+'</div>'+
    '<div class="pg" id="pg-scorers">'+pageScorers()+'</div>'+
    '<div class="pg" id="pg-settings">'+pageSettings()+'</div>'+
    (cm?pageMatchDetail(cm,MS):"")+(ct?pageTeamDetail(ct,MS):"");
  sp(cp);
  updateSB(true);
}

var cp="home",cm=null,ct=null;

function tabbar(){
  var tabs=[{id:"home",l:"🏠 首页"},{id:"schedule",l:"📅 赛程"},{id:"groups",l:"📊 排名"},{id:"bracket",l:"🏆 对阵"},{id:"teams",l:"⚽ 球队"},{id:"scorers",l:"🥅 射手榜"}];
  var h='<div class="tabs">';
  tabs.forEach(function(t){ h+='<button class="'+(t.id===cp?"on":"")+'" onclick="sw(\x27'+t.id+'\x27)">'+t.l+'</button>' });
  return h+'</div>';
}

function sw(p){ cp=p; cm=null; ct=null; render() }
function sp(p){
  document.querySelectorAll(".pg").forEach(function(e){ e.classList.remove("on") });
  var el=document.getElementById("pg-"+p); if(el) el.classList.add("on");
  document.querySelectorAll(".tabs button").forEach(function(b,i){ b.classList.toggle("on",["home","schedule","groups","bracket","teams","scorers"][i]===p) })
}

function mcard(m){
  var ht=gt(m.homeTeam), at=gt(m.awayTeam), st=m.status||"upcoming";
  var sm={upcoming:"未开始",live:"进行中",finished:"已结束"};
  var sc={upcoming:"st-up",live:"st-live",finished:"st-end"};
  var rm={group:m.g?m.g+"组":"","32":"32强","16":"16强",QF:"1/4决赛",SF:"半决赛","3RD":"三四名",FINAL:"决赛"};
  var rt=rm[m.round]||"";
  var center=m.homeScore!=null
    ?'<div class="scr"><span>'+m.homeScore+'</span><span>-</span><span>'+m.awayScore+'</span></div>'
    :'<span class="mt">'+ft(m.time)+'</span><span class="md">'+fd(m.date)+'</span>';
  return '<div class="mcard" onclick="vmatch('+m.id+')"><div class="mhd">'+(rt?'<span class="rb">'+rt+'</span>':'')+'<span class="ven">'+'</span><span class="stag '+sc[st]+'">'+sm[st]+'</span></div><div class="mbody"><div class="tc"><span class="fl">'+ht.f+'</span><span class="tn">'+ht.n+'</span></div><div class="mctr">'+center+'</div><div class="tc r"><span class="fl">'+at.f+'</span><span class="tn">'+at.n+'</span></div></div></div>'
}

function vmatch(id){ var MS=getMatches(); cm=MS.find(function(m){ return m.id===id }); render(); sp("match-detail") }
function vteam(id){ ct=TEAM_MAP[id]; render(); sp("team-detail") }

function pageHome(MS){
  var h='<div class="nav">';
  [{i:"📅",t:"赛程",p:"schedule"},{i:"📊",t:"排名",p:"groups"},{i:"🏆",t:"对阵",p:"bracket"},{i:"⚽",t:"球队",p:"teams"},{i:"🥅",t:"射手榜",p:"scorers"},{i:"⚙️",t:"设置",p:"settings"}].forEach(function(n){ h+='<div class="ni" onclick="sw(\x27'+n.p+'\x27)"><span class="ic">'+n.i+'</span><span class="tx">'+n.t+'</span></div>' });
  h+='</div><div class="sti">📋 已完成的比赛</div>';
  var done=MS.filter(function(m){ return m.status==="finished" }).sort(function(a,b){ return b.date.localeCompare(a.date)||(b.time||"").localeCompare(a.time||"") });
  done.forEach(function(m){ h+=mcard(m) });
  if(done.length===0) h+='<div class="empty"><span class="ei">📅</span>暂无已完成的比赛</div>';
  return h
}

function pageSchedule(MS){
  var h='<div class="filters" id="sround">';
  [{v:"all",l:"全部"},{v:"group",l:"小组赛"},{"v":"32",l:"32强"},{"v":"16",l:"16强"},{v:"QF",l:"1/4决赛"},{v:"SF",l:"半决赛"},{v:"FINAL",l:"决赛"}].forEach(function(r){ h+='<button class="ftag" onclick="sfRound(\x27'+r.v+'\x27)">'+r.l+'</button>' });
  h+='</div><div id="scontent"></div>';
  setTimeout(function(){ sfRound("group") },0);
  return h
}

var _sr="group",_sg="all";
function sfRound(r){ _sr=r; _sg="all"; sfRefresh() }
function sfGroup(g){ _sg=g; sfRefresh() }
function sfRefresh(){
  var MS=getMatches();
  var el=document.getElementById("sround"); if(!el) return;
  el.querySelectorAll(".ftag").forEach(function(b,i){ b.classList.toggle("on",["all","group","32","16","QF","SF","FINAL"][i]===_sr) });
  var sc=document.getElementById("scontent"); if(!sc) return;
  var h="";
  if(_sr==="group"){
    h+='<div class="filters">';
    h+='<button class="ftag '+(_sg==="all"?"on":"")+'" onclick="sfGroup(\x27all\x27)">全部</button>';
    GS.forEach(function(g){ h+='<button class="ftag '+(_sg===g?"on":"")+'" onclick="sfGroup(\x27'+g+'\x27)">'+g+'组</button>' });
    h+='</div>'
  }
  var fm=MS.filter(function(m){ return _sr==="all"||m.round===_sr });
  if(_sg!=="all"&&_sr==="group") fm=fm.filter(function(m){ return m.g===_sg });
  fm.sort(function(a,b){ return a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||"") });
  var ld=""; fm.forEach(function(m){
    if(m.date!==ld){ ld=m.date; h+='<div class="dh"><span class="dt">'+fd(m.date)+'</span>'+(m.matchday?'<span class="db">第'+m.matchday+'轮</span>':'')+'</div>' }
    h+=mcard(m)
  });
  if(fm.length===0) h+='<div class="empty"><span class="ei">📅</span>暂无比赛</div>';
  sc.innerHTML=h
}

function pageGroups(MS){
  var h='<div class="filters" id="gfilter">';
  GS.forEach(function(g){ h+='<button class="ftag" onclick="sgGroup(\x27'+g+'\x27)">'+g+'组</button>' });
  h+='</div><div id="gcontent"></div>'; setTimeout(function(){ sgGroup("A") },0);
  return h
}

var _gg="A";
function sgGroup(g){
  _gg=g; var MS=getMatches();
  var el=document.getElementById("gfilter"); if(el) el.querySelectorAll(".ftag").forEach(function(b,i){ b.classList.toggle("on",GS[i]===g) });
  var gc=document.getElementById("gcontent"); if(!gc) return;
  var h='<div class="card"><div class="sti">'+g+'组 积分榜</div>'+standings(g)+'</div>';
  h+='<div class="sti">'+g+'组 赛程</div>';
  MS.filter(function(m){ return m.g===g&&m.round==="group" }).sort(function(a,b){ return a.matchday-b.matchday }).forEach(function(m){ h+=mcard(m) });
  gc.innerHTML=h
}

function standings(gid){
  var tbl=ST_MAP[gid]||[];
  if(tbl.length===0) return '<div class="empty">暂无积分数据</div>';
  var h='<div class="gtw"><div class="trh"><span class="rc">#</span><span>球队</span><span style="text-align:center">赛</span><span style="text-align:center">胜</span><span style="text-align:center">平</span><span style="text-align:center">负</span><span style="text-align:center">进</span><span style="text-align:center">失</span><span style="text-align:center">净</span><span class="pts">分</span></div>';
  tbl.forEach(function(s,i){
    var gc=s.gd>0?"pos":s.gd<0?"neg":"";
    h+='<div class="tr"><span class="rc">'+(s.pos||i+1)+'</span><span class="tc2"><span class="fl" style="font-size:16px">'+s.flag+'</span><span class="tn">'+s.cnName+'</span></span><span style="text-align:center;color:#555">'+s.p+'</span><span style="text-align:center;color:#555">'+s.w+'</span><span style="text-align:center;color:#555">'+s.d+'</span><span style="text-align:center;color:#555">'+s.l+'</span><span style="text-align:center;color:#555">'+s.gf+'</span><span style="text-align:center;color:#555">'+s.ga+'</span><span class="'+gc+'" style="text-align:center;color:#555">'+(s.gd>0?"+"+s.gd:s.gd)+'</span><span class="pts">'+s.pts+'</span></div>'
  });
  return h+'</div>'
}

function pageBracket(MS){
  var rounds=[{r:"32",l:"32强"},{r:"16",l:"16强"},{r:"QF",l:"1/4决赛"},{r:"SF",l:"半决赛"},{r:"3RD",l:"🥉 三四名"},{r:"FINAL",l:"🏆 决赛"}];
  var h='<div class="bscroll">';
  rounds.forEach(function(rd){
    h+='<div class="bround"><div class="sti">'+rd.l+'</div>';
    MS.filter(function(m){ return m.round===rd.r }).forEach(function(m){
      var ht=gt(m.homeTeam), at=gt(m.awayTeam);
      h+='<div class="bm'+(rd.r==="FINAL"?" fin":"")+'" onclick="vmatch('+m.id+')">';
      h+='<div class="bt'+(m.homeScore>m.awayScore?" win":"")+'"><span class="fl">'+ht.f+'</span><span class="bn">'+ht.n+'</span>'+(m.homeScore!=null?'<span class="bs">'+m.homeScore+'</span>':'')+'</div>';
      h+='<div class="bt'+(m.awayScore>m.homeScore?" win":"")+'"><span class="fl">'+at.f+'</span><span class="bn">'+at.n+'</span>'+(m.awayScore!=null?'<span class="bs">'+m.awayScore+'</span>':'')+'</div>';
      h+='</div>'
    });
    h+='</div>'
  });
  return h+'</div>'
}

function pageTeams(){
  var h='<div id="tlist">';
  TEAMS_API.forEach(function(t){ h+='<div class="trow" onclick="vteam(\x27'+t.tla+'\x27)"><div class="tl"><span class="fl">'+t.flag+'</span><div class="ti"><span class="tn">'+t.cnName+'</span></div></div></div>' });
  return h+'</div>'
}

function pageScorers(){
  return '<div class="empty" style="padding-top:80px"><span class="ei">🥅</span>射手榜将在比赛后更新</div>'
}

function pageMatchDetail(m,MS){
  if(!m) return "";
  var ht=gt(m.homeTeam), at=gt(m.awayTeam), st=m.status||"upcoming";
  var sm={upcoming:"未开始",live:"进行中",finished:"已结束"};
  var sc={upcoming:"st-up",live:"st-live",finished:"st-end"};
  var rm={"32":"32强淘汰赛","16":"16强淘汰赛",QF:"1/4决赛",SF:"半决赛","3RD":"三四名决赛",FINAL:"决赛"};
  var rt=rm[m.round]||(m.g?m.g+"组 · 第"+m.matchday+"轮":"");
  var score=m.homeScore!=null
    ?'<div class="scr" style="font-size:44px"><span>'+m.homeScore+'</span><span>-</span><span>'+m.awayScore+'</span></div>'
    :'<span style="font-size:36px;font-weight:800;color:#ccc">VS</span>';
  var h='<div class="pg on" id="pg-match-detail"><button class="btnb" onclick="cm=null;render();sp(\x27home\x27)">⬅ 返回</button>';
  h+='<div class="banner"><p>'+rt+'</p><div class="sub">📍 '+fd(m.date)+' '+ft(m.time)+'</div></div>';
  h+='<div class="det" style="background:#fff;padding:24px"><div class="mbody"><div class="tc" style="flex-direction:column"><span class="fl">'+ht.f+'</span><span class="tn" style="font-size:18px;max-width:none">'+ht.n+'</span></div><div class="mctr">'+score+'</div><div class="tc" style="flex-direction:column"><span class="fl">'+at.f+'</span><span class="tn" style="font-size:18px;max-width:none">'+at.n+'</span></div></div><span class="stag '+sc[st]+'" style="margin-top:12px;display:inline-block">'+sm[st]+'</span></div></div>';
  return h
}

function pageTeamDetail(t,MS){
  if(!t) return "";
  var h='<div class="pg on" id="pg-team-detail"><button class="btnb" onclick="ct=null;render();sp(\x27home\x27)">⬅ 返回</button><div class="thdr"><span class="fl">'+t.shortName+'</span><div class="tn">'+t.name+'</div></div>';
  h+='<div class="sti">📅 小组赛程</div>';
  MS.filter(function(m){ return (m.homeTeam===t.tla||m.awayTeam===t.tla)&&m.round==="group" }).forEach(function(m){ h+=mcard(m) });
  return h+'</div>'
}

function pageSettings(){
  var h='<div class="banner"><h1>⚙️ 数据设置</h1><div class="sub">数据自动更新中</div></div>';
  h+='<div class="cfg"><div class="ccard"><div class="sti">📡 实时数据</div><div class="cl">数据来源: Football-Data.org<br>API已配置，每5分钟自动刷新</div>';
  h+='<button class="btnp" onclick="apiRefresh();render();sw(\x27home\x27)">🔄 手动刷新</button></div>';
  h+='<div class="ccard"><div class="sti">📋 完赛统计</div>';
  var MS=MATCHES_API;
  var groups={};
  MS.filter(function(m){ return m.status==="finished"&&m.g }).forEach(function(m){
    if(!groups[m.g]) groups[m.g]=[];
    groups[m.g].push(m);
  });
  Object.keys(groups).sort().forEach(function(g){
    h+='<div style="font-size:13px;padding:4px 0;color:#666"><b>'+g+'组</b>: '+groups[g].length+'/6</div>';
  });
  h+='</div></div>';
  return h
}

// 定时刷新 (5分钟)
setInterval(function(){ apiRefresh() }, 300000);
setTimeout(function(){ apiRefresh() }, 3000);

// 启动
render();

</script>
</body>
